<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your Relayo Password</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f5;
      color: #18181b;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      background-color: #f4f4f5;
      padding: 40px 0;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      border: 1px solid #e4e4e7;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 32px 24px;
      text-align: center;
    }

    .header h1 {
      color: #ffffff;
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .content {
      padding: 32px 24px;
    }

    .content p {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.6;
      color: #3f3f46;
    }

    .content h2 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      color: #18181b;
    }

    .btn-container {
      text-align: center;
      margin: 28px 0;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #4f46e5;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }

    .btn:hover {
      background-color: #4338ca;
    }

    .footer {
      background-color: #fafafa;
      border-top: 1px solid #f4f4f5;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: #a1a1aa;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>Relayo</h1>
      </div>
      <div class="content">
        <h2>Password Reset Request</h2>
        <p>Hello {{name}},</p>
        <p>We received a request to reset your Relayo account password. Click the button below to specify your new
          credentials:</p>
        <div class="btn-container">
          <a href="{{resetUrl}}" target="_blank" class="btn">Reset Password</a>
        </div>
      </div>
      <div class="footer">
        <p>This email was sent by Relayo Inc.</p>
        <p>If you didn't request this action, you can safely ignore this email.</p>
      </div>
    </div>
  </div>
</body>

</html>
